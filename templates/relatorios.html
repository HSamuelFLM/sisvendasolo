{% extends "base.html" %}

{% block title %}Relatórios - SisVenda{% endblock %}

{% block content %}
<div class="relatorios-page">
    <h1>Relatórios</h1>
    
    <div class="filtros-relatorio">
        <div class="form-group">
            <label>Data Início:</label>
            <input type="date" id="data-inicio">
        </div>
        <div class="form-group">
            <label>Data Fim:</label>
            <input type="date" id="data-fim">
        </div>
        <button class="btn btn-primary" onclick="carregarRelatorioVendas()">Filtrar</button>
    </div>
    
    <div class="relatorios-grid">
        <div class="relatorio-card">
            <h2>Vendas por Período</h2>
            <div id="relatorio-vendas">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Total de Vendas</th>
                            <th>Valor Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-relatorio-vendas">
                        <!-- Carregado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="relatorio-card">
            <h2>Produtos Mais Vendidos</h2>
            <div id="relatorio-produtos">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade Vendida</th>
                            <th>Valor Total</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-produtos-vendidos">
                        <!-- Carregado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function carregarRelatorioVendas() {
        const dataInicio = document.getElementById('data-inicio').value;
        const dataFim = document.getElementById('data-fim').value;
        
        let url = '/api/relatorios/vendas';
        if (dataInicio && dataFim) {
            url += `?data_inicio=${dataInicio}&data_fim=${dataFim}`;
        }
        
        try {
            const response = await fetch(url);
            const dados = await response.json();
            
            const tbody = document.getElementById('tabela-relatorio-vendas');
            tbody.innerHTML = '';
            
            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">Nenhuma venda encontrada</td></tr>';
                return;
            }
            
            dados.forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${new Date(item.data).toLocaleDateString('pt-BR')}</td>
                    <td>${item.total_vendas}</td>
                    <td>R$ ${item.total_valor.toFixed(2)}</td>
                `;
            });
        } catch (error) {
            console.error('Erro ao carregar relatório:', error);
        }
    }
    
    async function carregarProdutosMaisVendidos() {
        try {
            const response = await fetch('/api/relatorios/produtos');
            const dados = await response.json();
            
            const tbody = document.getElementById('tabela-produtos-vendidos');
            tbody.innerHTML = '';
            
            dados.forEach(item => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${item.nome}</td>
                    <td>${item.total_quantidade}</td>
                    <td>R$ ${item.total_valor.toFixed(2)}</td>
                `;
            });
        } catch (error) {
            console.error('Erro ao carregar produtos:', error);
        }
    }
    
    // Inicializar
    carregarRelatorioVendas();
    carregarProdutosMaisVendidos();
</script>
{% endblock %}
