{% extends "base.html" %}

{% block title %}Produtos - SisVenda{% endblock %}

{% block content %}
<div class="produtos-page">
    <div class="page-header">
        <h1>Gerenciar Produtos</h1>
        <button class="btn btn-primary" onclick="abrirModalProduto()">Novo Produto</button>
    </div>

    <div class="search-bar">
        <input type="text" id="buscar-produto" placeholder="Buscar produto..." 
               onkeyup="filtrarProdutos()">
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-produtos">
            <!-- Dados serão carregados via JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal de Produto -->
<div id="modal-produto" class="modal">
    <div class="modal-content">
        <span class="close" onclick="fecharModalProduto()">&times;</span>
        <h2 id="modal-title">Novo Produto</h2>
        <form id="form-produto">
            <input type="hidden" id="produto-id">
            
            <div class="form-group">
                <label>Nome:</label>
                <input type="text" id="nome" required>
            </div>
            
            <div class="form-group">
                <label>Descrição:</label>
                <textarea id="descricao" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>Preço:</label>
                <input type="number" id="preco" step="0.01" min="0" required>
            </div>
            
            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" id="quantidade" min="0" required>
            </div>
            
            <button type="submit" class="btn btn-success">Salvar</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let produtos = [];
    
    async function carregarProdutos() {
        try {
            const response = await fetch('/api/produtos');
            produtos = await response.json();
            exibirProdutos(produtos);
        } catch (error) {
            console.error('Erro ao carregar produtos:', error);
        }
    }
    
    function exibirProdutos(lista) {
        const tbody = document.getElementById('tabela-produtos');
        tbody.innerHTML = '';
        
        lista.forEach(produto => {
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${produto.id}</td>
                <td>${produto.nome}</td>
                <td>${produto.descricao || '-'}</td>
                <td>R$ ${produto.preco.toFixed(2)}</td>
                <td>
                    <span class="badge ${produto.quantidade < 10 ? 'badge-danger' : 'badge-success'}">
                        ${produto.quantidade}
                    </span>
                </td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editarProduto(${produto.id})">Editar</button>
                    <button class="btn btn-sm btn-danger" onclick="deletarProduto(${produto.id})">Excluir</button>
                </td>
            `;
        });
    }
    
    function filtrarProdutos() {
        const termo = document.getElementById('buscar-produto').value.toLowerCase();
        const filtrados = produtos.filter(p => 
            p.nome.toLowerCase().includes(termo) || 
            (p.descricao && p.descricao.toLowerCase().includes(termo))
        );
        exibirProdutos(filtrados);
    }
    
    function abrirModalProduto() {
        document.getElementById('modal-title').textContent = 'Novo Produto';
        document.getElementById('form-produto').reset();
        document.getElementById('produto-id').value = '';
        document.getElementById('modal-produto').style.display = 'block';
    }
    
    function fecharModalProduto() {
        document.getElementById('modal-produto').style.display = 'none';
    }
    
    async function editarProduto(id) {
        const produto = produtos.find(p => p.id === id);
        if (!produto) return;
        
        document.getElementById('modal-title').textContent = 'Editar Produto';
        document.getElementById('produto-id').value = produto.id;
        document.getElementById('nome').value = produto.nome;
        document.getElementById('descricao').value = produto.descricao || '';
        document.getElementById('preco').value = produto.preco;
        document.getElementById('quantidade').value = produto.quantidade;
        
        document.getElementById('modal-produto').style.display = 'block';
    }
    
    async function deletarProduto(id) {
        if (!confirm('Tem certeza que deseja excluir este produto?')) return;
        
        try {
            const response = await fetch(`/api/produtos/${id}`, {
                method: 'DELETE'
            });
            
            if (response.ok) {
                carregarProdutos();
                alert('Produto excluído com sucesso!');
            }
        } catch (error) {
            console.error('Erro ao excluir produto:', error);
        }
    }
    
    document.getElementById('form-produto').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('produto-id').value;
        const dados = {
            nome: document.getElementById('nome').value,
            descricao: document.getElementById('descricao').value,
            preco: parseFloat(document.getElementById('preco').value),
            quantidade: parseInt(document.getElementById('quantidade').value)
        };
        
        try {
            let response;
            if (id) {
                response = await fetch(`/api/produtos/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });
            } else {
                response = await fetch('/api/produtos', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });
            }
            
            if (response.ok) {
                fecharModalProduto();
                carregarProdutos();
                alert('Produto salvo com sucesso!');
            }
        } catch (error) {
            console.error('Erro ao salvar produto:', error);
        }
    });
    
    // Carregar produtos ao iniciar
    carregarProdutos();
</script>
{% endblock %}
